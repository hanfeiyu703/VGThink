[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgthink"
version = "0.1.0"
description = "Minimal implementation of VGThink for grounded multimodal named entity recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.14,<2",
  "numpy>=1.24",
  "peft>=0.18,<0.19",
  "Pillow>=10",
  "safetensors>=0.8,<1",
  "torch>=2.6",
  "tqdm>=4.65",
  "transformers>=5.12,<5.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
